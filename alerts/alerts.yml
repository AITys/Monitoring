groups:
  - name: system_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: 'CPU usage on {{ $labels.instance }} is above 80% for more than 2 minutes.'
